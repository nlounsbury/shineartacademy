<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Art Academy — Coming Soon</title>
<style>
  :root {
    --ink: #1c1c1c;
    --charcoal: #2b2b2b;
    --orange: #f2a129;
    --orange-dark: #d88a1a;
    --cream: #fdfcfa;
    --line: #e8e5df;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
    background: var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 26px 24px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }

  .logo {
    display: flex;
    align-items: center;
  }

  .logo-img {
    height: 78px;
    width: auto;
    display: block;
  }

  /* Hero */
  .hero {
    position: relative;
    min-height: 78vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 140% 90% at 15% 20%, #d9a24a 0%, transparent 45%),
      radial-gradient(ellipse 120% 80% at 85% 15%, #b7c95a 0%, transparent 50%),
      linear-gradient(160deg, #3f7a72 0%, #2d6a7a 28%, #1f4f66 55%, #163c56 78%, #0f2c42 100%);
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(100deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 26px),
      repeating-linear-gradient(94deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 3px, transparent 3px, transparent 40px);
    mix-blend-mode: overlay;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    max-width: 720px;
  }

  .eyebrow {
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.9;
    margin-bottom: 20px;
  }

  .hero h1 {
    color: #fff;
    font-size: clamp(42px, 8vw, 84px);
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 1.03;
    text-shadow: 0 2px 24px rgba(0,0,0,0.25);
    margin-bottom: 22px;
  }

  .hero p {
    color: rgba(255,255,255,0.92);
    font-size: 18px;
    line-height: 1.6;
    max-width: 520px;
    margin: 0 auto 34px;
  }

  /* Social row (hero) */
  .hero-socials {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 8px;
  }

  .hero-socials a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    border: 1.5px solid rgba(255,255,255,0.5);
    color: #fff;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }

  .hero-socials a svg { width: 24px; height: 24px; }

  .hero-socials a:hover {
    background: var(--orange);
    border-color: var(--orange);
    color: var(--ink);
    transform: translateY(-3px);
  }

  .hero-socials a:hover svg { stroke: var(--ink); fill: var(--ink); }

  /* Footer */
  footer {
    background: var(--charcoal);
    color: rgba(255,255,255,0.75);
    text-align: center;
    padding: 28px 24px;
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  footer .footer-note {
    opacity: 0.7;
  }

  @media (max-width: 480px) {
    .hero-socials { gap: 14px; }
    .hero-socials a { width: 50px; height: 50px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="shine_art_academy_logo_black.png" alt="Shine Art Academy" class="logo-img">
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <div class="eyebrow">Something New Is Coming</div>
      <h1>A MASTERPIECE<br>IN PROGRESS</h1>
      <p>We're painting a brand new site for Shine Art Academy. Follow along or reach out directly — we'd love to hear from you.</p>

      <div class="hero-socials">
        <a href="https://www.instagram.com/popular/shine-art-academy/" target="_blank" rel="noopener" aria-label="Follow on Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <a href="https://www.facebook.com/p/Shine-Art-Academy-100063620132428" target="_blank" rel="noopener" aria-label="Follow on Facebook">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 8.5h2.5V5H15c-2.2 0-4 1.8-4 4v2.2H9V14h2v6.5h3V14h2.4l.6-3.3H14V9c0-.8.4-1.5 1-1.5z"/>
          </svg>
        </a>
        <a href="mailto:shineartacademy@gmail.com" aria-label="Email us">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
          </svg>
        </a>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-note">&copy; <span id="year"></span> Shine Art Academy. All rights reserved.</div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
